name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Multi-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Compile Multi-Platform Binaries
        run: |
          mkdir -p dist

          # 1. Windows x86_64 (.exe and .zip)
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o dist/attendance-windows-amd64.exe .
          cp dist/attendance-windows-amd64.exe dist/attendance.exe
          zip -j dist/attendance-windows-amd64.zip dist/attendance.exe
          rm dist/attendance.exe

          # 2. Linux x86_64 (binary and .tar.gz)
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/attendance-linux-amd64 .
          tar -czvf dist/attendance-linux-amd64.tar.gz -C dist attendance-linux-amd64

          # 3. macOS Apple Silicon ARM64 (binary and .tar.gz)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/attendance-darwin-arm64 .
          tar -czvf dist/attendance-darwin-arm64.tar.gz -C dist attendance-darwin-arm64

          # 4. macOS Intel AMD64 (binary and .tar.gz)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/attendance-darwin-amd64 .
          tar -czvf dist/attendance-darwin-amd64.tar.gz -C dist attendance-darwin-amd64

          # Generate SHA256 Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Attendance Automation ${{ github.ref_name }}"
          files: |
            dist/attendance-windows-amd64.exe
            dist/attendance-windows-amd64.zip
            dist/attendance-linux-amd64
            dist/attendance-linux-amd64.tar.gz
            dist/attendance-darwin-arm64
            dist/attendance-darwin-arm64.tar.gz
            dist/attendance-darwin-amd64
            dist/attendance-darwin-amd64.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
